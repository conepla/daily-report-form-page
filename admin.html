        el('button', { type: 'button', class: 'btn-mini danger reissue-url', disabled: busy, on: { click: function () {
          confirmReissue = id; message = null; render();
        } } }, '作り直して送る')),
      shownUrl[id]
        ? el('input', { type: 'text', class: 'url-box', readonly: true, value: shownUrl[id], 'aria-label': m.name + 'さんの専用アドレス',
            on: { focus: function (e) { e.target.select(); } } })
        : null,
      confirmReissue === id
        ? el('div', { class: 'confirm', role: 'alertdialog', 'aria-label': m.name + 'さんのアドレスの作り直しの確認' },
            el('b', null, m.name + 'さんのアドレスを作り直しますか？'),
            el('span', null, '今のアドレスは使えなくなり、新しいアドレスを本人にDMで送ります（休止中・開始前の人には送りません）。アドレスが漏れたかもしれないときに使います。'),
            el('div', { class: 'confirm-btns' },
              el('button', { type: 'button', class: 'confirm-yes', disabled: busy, on: { click: function () {
                call('reissueMemberUrl', [id], function (r) {
                  confirmReissue = null;
                  delete shownUrl[id];
                  message = { text: !r.ok
                    ? m.name + 'さんのアドレスは作り直しましたが、DMを送れませんでした（' + r.error + '）。「アドレスを表示」からコピーして渡してください。'
                    : r.sent ? m.name + 'さんのアドレスを作り直して送りました。' : m.name + 'さんのアドレスを作り直しました（休止中・開始前のため送っていません）。' };
                });
              } } }, '作り直して送る'),
              el('button', { type: 'button', class: 'confirm-no', disabled: busy, on: { click: function () { confirmReissue = null; render(); } } }, 'やめる')))
        : null,
      confirmDelete === id
        ? el('div', { class: 'confirm', role: 'alertdialog', 'aria-label': m.name + 'さんの削除の確認' },
            el('b', null, m.name + 'さんを削除しますか？'),
            el('span', null, '過去の報告は残ります。DMは届かなくなります。また参加する可能性がある人は「休止中」がおすすめです。'),
            el('div', { class: 'confirm-btns' },
              el('button', { type: 'button', class: 'confirm-yes', disabled: busy, on: { click: function () {
                call('deleteMember', [id], function (list) { confirmDelete = null; dropEditsFor(id); setMembers(list, m.name + 'さんを削除しました。'); });
              } } }, '削除する'),
              el('button', { type: 'button', class: 'confirm-no', disabled: busy, on: { click: function () { confirmDelete = null; render(); } } }, 'やめる')))
        : el('button', { type: 'button', class: 'del-member', disabled: busy, on: { click: function () { confirmDelete = id; message = null; render(); } } }, 'このメンバーを削除')),
    el('div', { class: 'body' },
      m.tasks.length ? el('div', { class: 'tl' }, tasks)
        : el('p', { class: 'empty' }, '作業内容がありません。この人のフォームには何も並びません。'),
      el('div', { class: 'add' },
        el('label', { for: inputId, class: 'sr' }, m.name + 'さんに追加する作業内容'),
        el('input', { id: inputId, type: 'text', maxlength: '40', placeholder: '作業内容を追加（例：データ分析）', value: drafts[id] || '',
          on: {
            input: function (e) { drafts[id] = e.target.value; },
            keydown: function (e) { if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) addTask(); }
          } }),
        el('button', { type: 'button', class: 'btn btn-outline', disabled: busy, on: { click: addTask } }, '追加'))));
  function addTask() {
    const name = (drafts[id] || '').trim();
    call('addMemberTask', [id, name], function (list) { drafts[id] = ''; setMembers(list, m.name + 'さんに「' + name + '」を追加しました。'); });
  }
}
function newMemberForm() {
  function field(id, key, placeholder, type, width) {
    return [
      el('label', { for: id, class: 'sr' }, placeholder),
      el('input', { id: id, type: type || 'text', placeholder: placeholder, value: newMember[key], css: width ? 'width:' + width : null,
        on: { input: function (e) { newMember[key] = e.target.value; } } })
    ];
  }
  return el('section', { class: 'card dashed' },
    el('h2', null, 'メンバーを追加'),
    el('p', { class: 'hint' }, 'SlackユーザーIDは、Slackでその人のプロフィールを開き「︙（その他）」→「メンバーIDをコピー」で取れます（Uから始まる文字列）。追加した人は「有効」「日本語」で始まります。'),
    el('div', { class: 'newmem' },
      field('new-name', 'name', '名前', 'text', '180px'),
      field('new-slack', 'slackId', 'SlackユーザーID（U…）', 'text', '210px'),
      field('new-start', 'start', '開始日（任意）', 'date', '170px'),
      el('button', { type: 'button', id: 'add-member', class: 'btn btn-fill', disabled: busy, on: { click: function () {
        const name = newMember.name.trim();
        call('addMember', [name, newMember.slackId.trim(), newMember.start], function (list) {
          newMember.name = ''; newMember.slackId = ''; newMember.start = '';
          setMembers(list, name + 'さんを追加しました。続けて作業内容を割り当ててください。');
        });
      } } }, '追加')));
}
function gate(text) {
  const app = document.getElementById('app');
  app.textContent = '';
  add(app, el('div', { class: 'page' }, el('p', { class: 'err', role: 'alert' }, text)));
}
function start() {
  if (window.top !== window.self) return;
  if (navigator.serviceWorker) {
    navigator.serviceWorker.getRegistrations().then(function (list) {
      list.forEach(function (reg) { if (location.href.indexOf(reg.scope) === 0) reg.unregister(); });
    }, function () {});
    if (navigator.serviceWorker.controller) { gate(SW_MSG); return; }
  }
  if (!KEY) { gate(KEY_MSG); return; }
  loadMonth('');
}
start();
</script>
</body>
</html>
